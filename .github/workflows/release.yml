name: Release readiness

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  publication:
    name: Fail-closed publication and package gate
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Set up locked dependency installer
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          enable-cache: true
      - name: Install exact release environment
        run: uv sync --locked --extra dev --extra security
      - name: Require verified licenses and immutable source snapshots
        run: >-
          uv run python security/verify_sources.py
          --manifest data/sources.yml --metadata-only --publication
      - name: Build distributions
        run: uv run python -m build
      - name: Validate distributions
        run: uv run twine check dist/*
      - name: Generate SBOM from the exact installed release environment
        run: >-
          uv run cyclonedx-py environment .venv/bin/python
          --output-format JSON --output-file release-sbom.cdx.json
      - name: Sign and attest built distributions
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
      - name: Bind the installed-environment SBOM to the distributions
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
          sbom-path: release-sbom.cdx.json
