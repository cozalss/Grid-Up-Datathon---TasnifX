name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python }} quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # MATRIS 2026-08-18'de DORT SURUMDEN IKIYE indirildi.
      #
      # Tutulan ikisinin GERCEK bir tuketicisi var:
      #   3.11  gelistirici makinesi
      #   3.12  KAGGLE -- juri notebook'unun kosacagi ortam. Yerelde calisip
      #         Kaggle'da patlayan kod eleme sebebidir; bu is o riski kapatir.
      #
      # 3.10 ve 3.13 kaldirildi: ikisini de kullanan kimse yok, her push'ta
      # iki kat gurultu uretiyorlardi. Kaynak yine 3.10 uyumlu tutuluyor
      # (ruff target-version = py310) ve requires-python >=3.10 degismedi;
      # yalnizca OTOMATIK denetim yuzeyi daraltildi.
      #
      # NOT: 3.10 isi kaldirilmadan once ise yaradi -- numpy 2.2.6 stub'lari
      # altinda UC gercek tip hatasi bulup kapattirdi (986a74d).
      matrix:
        include:
          - python: "3.11"
            constraints: requirements/constraints-py311.txt
          - python: "3.12"
            constraints: requirements/constraints-py312.txt
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Set up locked dependency installer
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          enable-cache: true
      - name: Install the exact tested dependency graph
        run: uv sync --locked --extra full --extra dev --extra security
      - name: Lint
        run: uv run ruff check src tests scripts security
      - name: Format contract
        run: uv run ruff format --check src tests scripts security
      - name: Static type contract
        run: uv run mypy src/gridup
      - name: Test with enforced coverage
        run: >-
          uv run python -m pytest -p no:cacheprovider
          --cov=gridup --cov-report=term-missing --cov-report=xml
          --cov-fail-under=85
      - name: Audit locked graph for this Python
        run: |
          uv export --locked --extra full --extra dev --extra security --no-emit-project --format requirements-txt --output-file locked-${{ matrix.python }}.txt
          uv run pip-audit --requirement locked-${{ matrix.python }}.txt --disable-pip
      - name: End-to-end synthetic pipeline
        if: matrix.python == '3.11'
        run: uv run python scripts/smoke_test.py

  windows-smoke:
    name: Windows install and E2E smoke
    runs-on: windows-latest
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Set up locked dependency installer
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          enable-cache: true
      - name: Install exact tested Windows environment
        run: uv sync --locked --extra full --extra dev
      - name: Windows CLI and atomic-output contracts
        run: >-
          uv run python -m pytest
          tests/test_package_cli_contract.py
          tests/test_atomic_output_contract.py
          tests/test_submission_order_contract.py
      - name: Windows end-to-end synthetic pipeline
        env:
          PYTHONIOENCODING: utf-8
        run: uv run python scripts/smoke_test.py

  governance:
    name: Supply chain and governance gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Set up locked dependency installer
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          enable-cache: true
      - name: Install exact governance environment
        run: uv sync --locked --extra full --extra dev --extra security
      - name: Gitleaks-like tracked and history secret scan
        run: uv run python security/scan_secrets.py --history
      - name: Independent Gitleaks full-history scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify cross-platform transitive dependency lock
        run: uv lock --check
      - name: Source, license, hash and schema contract
        run: uv run python security/verify_sources.py --manifest data/sources.yml --metadata-only
      - name: Export and audit the exact locked environment
        run: |
          uv export --locked --extra full --extra dev --extra security --no-emit-project --format requirements-txt --output-file locked-requirements.txt
          uv run pip-audit --requirement locked-requirements.txt --disable-pip
      - name: Build wheel and source distribution
        run: uv run python -m build
      - name: Validate package metadata
        run: uv run twine check dist/*
      - name: Install built wheel and smoke both CLIs
        run: |
          python -m venv .wheel-smoke
          uv export --locked --no-emit-project --format requirements-txt --output-file locked-core.txt
          uv pip install --python .wheel-smoke/bin/python --require-hashes --requirement locked-core.txt
          uv pip install --python .wheel-smoke/bin/python --no-deps dist/*.whl
          .wheel-smoke/bin/gridup-doctor --version
          .wheel-smoke/bin/gridup-validate-submission --help
      - name: Generate CycloneDX SBOM
        run: >-
          uv run cyclonedx-py environment .venv/bin/python
          --output-format JSON --output-file sbom.cdx.json
      - name: Upload package and SBOM evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package-and-sbom
          path: |
            dist/*
            sbom.cdx.json
          if-no-files-found: error
          retention-days: 14
