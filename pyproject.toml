[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gridup"
dynamic = ["version"]
description = "Grid Up Datathon - Coderspace x GDZ Elektrik x ADM Elektrik yarisma pipeline'i"
readme = "README.md"
license = "MIT"
authors = [{name = "Grid Up Datathon Team"}]
requires-python = ">=3.10"

# Cekirdek: bu ucu paketin HER modulu modul seviyesinde import eder.
# Ust sinir KOYMUYORUZ -- Kaggle imaji bizim yerel surumumuzden ESKI olabilir
# (olculdu: Kaggle numpy 2.0.2, yerel 2.4.6) ve bir ust sinir orada kurulumu
# sessizce reddettirir.
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "packaging>=23.0",
    "tomli>=2.0; python_version < '3.11'",
]

# Geri kalan her sey TEMBEL import edilir (fonksiyon icinde). Boylece
# lightgbm kullanmayan bir notebook onu yuklemek zorunda kalmaz ve Kaggle'da
# eksik tek bir paket TUM paketi import edilemez kilmaz.
[project.optional-dependencies]
models = ["lightgbm>=4.0", "xgboost>=2.0", "catboost>=1.2"]
# Sinir agi OPSIYONELDIR: harmana cesitlilik katar, birincil model degildir.
# Kaggle imajinda torch ZATEN vardir; offline pakete koymuyoruz (yuzlerce MB).
# DAGITIM SOZLESMESI: cekirdek paket/CLI torch import etmez; ana CI bu agir
# extra'yi kurmaz. Neural kullanan ortam ``pip install gridup[neural]`` secer.
neural = ["torch>=2.0"]
search = ["optuna>=3.5", "shap>=0.44"]
features = ["holidays>=0.40", "pvlib>=0.10", "hijridate>=2.4"]
io = ["pyarrow>=14.0", "requests>=2.31", "openpyxl>=3.1"]
viz = ["matplotlib>=3.7"]
# Kaggle CLI: tuketim_model.py --gonder bunu ALT SUREC olarak cagirir
# (subprocess "kaggle competitions submit"), yani kod icinden import edilmez
# ama gonderim yapan makinede KURULU OLMAK ZORUNDA. Cekirdege konmuyor:
# Kaggle imajinda notebook calistirirken bu paket gereksiz.
kaggle = ["kaggle>=1.6"]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "hypothesis>=6.90",
    "ruff>=0.5",
    "mypy>=2.3",
    "uv>=0.12",
    "build>=1.2",
    "wheel>=0.45",
    "twine>=5.1",
]

security = [
    "pip-audit>=2.7",
    "cyclonedx-bom>=4.6",
]
full = [
    "lightgbm>=4.0", "xgboost>=2.0", "catboost>=1.2",
    "optuna>=3.5", "shap>=0.44",
    "holidays>=0.40", "pvlib>=0.10", "hijridate>=2.4",
    "pyarrow>=14.0", "requests>=2.31", "openpyxl>=3.1",
    "matplotlib>=3.7",
]

[project.scripts]
gridup-doctor = "gridup.cli:doctor_main"
gridup-validate-submission = "gridup.cli:validate_submission_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "gridup._version.__version__"}

[tool.coverage.run]
# neural.py yalnizca ``torch`` ile calisir ve torch ``neural`` extra'sindadir --
# CI'in kilitli grafigi (full+dev+security) torch KURMAZ (Linux CUDA wheel'i
# ~GB; datathon CI'i icin kasitli). Torch yokken tum neural testleri skip
# olur ve 204 satir "kapsanmadi" gorunur; bu, kodun test edilmedigi degil,
# o ortamda calistirilamadigi anlamina gelir. Modul, torch kurulu makinede
# tests/test_neural.py ile olculur.
omit = ["*/gridup/neural.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q --strict-markers"
markers = [
    "slow: model egiten testler (varsayilan calisir, -m 'not slow' ile atlanir)",
]

# IKI uyari sinifini HATA sayiyoruz. Ucuncusunu (DeprecationWarning) KASITLI
# olarak sayimiyoruz -- o ucuncu taraf kutuphane calkantisidir ve bizim
# hatamiz degildir; build'i sebepsiz kirmasin.
#
# ResourceWarning: kapatilmamis dosya tanitiCisi. Windows'ta bu sadece
#   sizinti degil KILITLENMEDIR -- ayni yola sonradan yazmak PermissionError
#   verir. io_utils.py:88'de tam olarak bu vardi (olculdu).
# RuntimeWarning: sifira bolme, tasma, gecersiz islem. Her biri ya gercek bir
#   sayisal hata ya da ele alinmamis bir kenar durumdur. Bilincli olanlari
#   np.errstate ile susturmak zaten dogru cozumdur.
filterwarnings = [
    "error::ResourceWarning",
    "error::RuntimeWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RET", "PTH", "PL"]
ignore = [
    "PLR0913",  # cok parametre: feature fonksiyonlari dogal olarak cok parametreli
    "PLR0917",  # ayni gerekce, konumsal parametreler icin
    "PLR2004",  # sihirli sayi: esikler zaten adlandirilmis sabitlerde
    "N803",     # X, y gibi ML kongresi argüman adlari
    "N806",     # ayni, yerel degiskenler icin
    # Tembel import KASITLIDIR: lightgbm/catboost/xgboost/torch agir bagimliliklardir.
    # Modul duzeyinde import etmek, o kutuphaneyi kullanmayan bir notebook'u da
    # yavaslatir ve Kaggle'da eksik bir paket tum paketi import edilemez kilar.
    "PLC0415",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004", "S101"]
# Betikler paketi src/ uzerinden bulmak icin import'tan ONCE sys.path'i ayarlar.
# Bu, kurulum yapmadan calisabilmeleri icin bilincli bir tercihtir.
"scripts/*" = ["E402", "PLR0912", "PLR0915"]
# TEK SORULUK TESHIS BETIKLERI. eksen*/curut_*/h<N>*/coz_* ailesi bir gecede
# yazilip bir soruyu cevaplamak icin kosulur ve KANIT KAYDI olarak saklanir:
# hicbiri import edilmez, hicbiri surdurulmez, ciktilarina docs/ ve reports/
# altindan atif yapilir. Uretim betikleri (tuketim_model, son_islem*,
# butunluk_*, birlestir_*, tasima_*) bu listeye GIRMEZ -- onlar tam kapiya tabi.
#
# Neden susturuluyor, duzeltilmiyor: kalan 155 ihlalin cogu --unsafe-fixes
# gerektiriyor ve o duzeltmeler KOD SILER (F841 kullanilmayan atama, F401
# kullanilmayan import). Bir teshis betiginde silinen atama, o betigin NE
# OLCTUGUNU degistirebilir; kayit olarak degeri de tam olarak orada. Ayni
# gerekce scripts/kapi_oncesi.py'de yaziyor: "lint hatasi insana bildirilir,
# otomatik duzeltilmez". Guvenli olan 86 duzeltme UYGULANDI; kalanlar bilerek
# oldugu gibi birakildi.
"scripts/eksen*.py" = ["E501", "F841", "B007", "B905", "UP031", "N816", "RET504", "PLW1510", "F601", "B023", "PTH123", "PLW2901", "N812", "E741", "E731"]
"scripts/curut_*.py" = ["E501", "F841", "B007", "B905", "UP031", "N816", "RET504", "PLW1510", "F601", "B023", "PTH123", "PLW2901", "N812", "E741", "E731"]
"scripts/h[0-9]*.py" = ["E501", "F841", "B007", "B905", "UP031", "N816", "RET504", "PLW1510", "F601", "B023", "PTH123", "PLW2901", "N812", "E741", "E731"]
"scripts/coz_*.py" = ["E501", "F841", "B007", "B905", "UP031", "N816", "RET504", "PLW1510", "F601", "B023", "PTH123", "PLW2901", "N812", "E741", "E731"]
"scripts/day_one.py" = ["E402", "PLR0911", "PLR0912", "PLR0915"]
# EXPERIMENTS/ -- ajan fan-out'larinin kanit kaydi. scripts/eksen*/curut_* ailesiyle
# AYNI SINIF: her betik bir gecede bir soruyu cevaplamak icin yazilir, bir kez kosar,
# hicbiri import edilmez, hicbiri surdurulmez; ciktilarina docs/ ve reports/ altindan
# atif yapilir. Degeri tam olarak KOSTUGU HALIYLE saklanmasindadir -- bu yuzden
# --unsafe-fixes uygulanmaz (F841/RET504 duzeltmeleri atama siler ve betigin NE
# OLCTUGUNU degistirebilir). Guvenli 108 duzeltme UYGULANDI; j03_uclar.py'deki
# gercek F509/PLE1300 hatasi ELLE duzeltildi. Kalanlar bilerek oldugu gibi.
# EXPERIMENTS/MODEL29 -- 28 Agustos gecesi ileri-pencere model kolu (docs/53).
# Ayni sinif, ayni gerekce: bir gecelik teshis betikleri, KOSTUGU HALIYLE saklanir.
# Ek olarak PTH* ve F403/F405 susturuluyor: os.path kullanimlari ve
# `from m10_ortak import *` bu betiklerin kosarken kullandigi bicimdir; pathlib'e
# cevirmek ya da import'lari acmak, betigin NE OLCTUGUNU degistirme riskini tasir
# ve kanit kaydinin degeri tam olarak degistirilmemis olmasindadir.
"experiments/model29/*" = [
    "E402", "E501", "E701", "E702", "E731", "E741", "B007", "B023", "B905", "F403", "F405", "F841",
    "N802", "N812", "N816", "PLC0206", "PLR0124", "PLR0911", "PLR0912", "PLR0915",
    "PLR0133", "PLW0603", "PLW2901", "PTH100", "PTH103", "PTH110", "PTH118", "PTH119", "PTH120",
    "PTH123", "PTH202", "PTH208",
    "RET504", "SIM108", "SIM115", "UP031",
]
"experiments/*" = [
    "E402", "E501", "E741", "B007", "B023", "B905", "F841", "N802", "N812", "N816",
    "PLC0206", "PLR0124", "PLR0911", "PLR0912", "PLR0915", "PLW0603", "PLW2901",
    "PTH123", "RET504", "SIM108", "SIM115", "UP031",
]
# Dogrulama ve submission kontrolleri dogasi geregi cok dalli: her dal ayri bir
# hata sinifini yakalar. Bolmek okunabilirligi artirmaz, dagitir.
"src/gridup/validation.py" = ["PLR0912"]
"src/gridup/submission.py" = ["PLR0912", "PLR0915"]
"src/gridup/profiling.py" = ["PLR0911"]
# build_paired_history_features'in dallarinin HEPSI bir sizinti kapisidir:
# _ZORUNLU nobetcisi, train/test zaman ortusmesi, test'in hedef tasimasi,
# NaN yer tutucu, eksik kolon. Bolmek kapilari birbirinden ayirir ve
# "hangisi hangi durumu koruyordu" izini kaybettirir -- validation.py ve
# submission.py ile ayni gerekce.
"src/gridup/pipeline.py" = ["PLR0912"]
# daily_point_intensity'nin dallari girdi kapilaridir (eksik kolon, gecersiz
# yaricap, tekrarlanan anahtar, agirlik var/yok, bos olay kumesi). Her biri
# ayri bir sessiz-yanlis-sonuc yolunu kapatir; bolmek kapilari dagitir.
"src/gridup/features/point_events.py" = ["PLR0912"]
# Manifest dogrulama fail-closed kontrolleri tek raporda toplar; her dal ayri
# bir supply-chain ihlalini kullaniciya gostermek icin gereklidir.
"security/verify_sources.py" = ["PLR0912", "PLR0915"]
# Notebook'lar Kaggle'da da calisabilmek icin ilk hucrede sys.path ayarlar (E402).
# F401: ilk hucre, kullanicinin SONRA yazacagi hucreler icin gereken her seyi
# import eder -- sablonun isi budur. I001: import sirasi notebook'ta okunabilirlik
# icin mantiksal gruplanmis (cekirdek / feature / model / harman).
# F821: sablon hucreleri, kullanicinin onceki hucrelerde tanimlayacagi
# degiskenlere (y_true, y_pred) atifta bulunur -- sablonun dogasi budur.
# E702: grafik hucrelerinde 'plot(...); plt.show()' okunabilirligi artiriyor.
"notebooks/*" = ["E402", "F401", "I001", "F821", "E702"]

[tool.mypy]
# python_version BILEREK VERILMIYOR -- mypy kostugu yorumlayicinin surumunu
# kullanir. Sabitlemek (or. "3.10") mypy'ye UCUNCU TARAF stub'larini da 3.10
# dilbilgisiyle ayristirmasini soyler; CI'da numpy 2.5.2 (Python >=3.12 icin
# kilitli) stub'inda PEP 695 ``type`` ifadesi kullaniyor ve mypy bunu
# "Type statement is only supported in Python 3.12 and greater" diye
# REDDEDIYORDU. Yerelde gorunmuyordu cunku Python 3.11'de numpy 2.4.6 kurulu
# ve o stub'da ``type`` ifadesi yok.
#
# Kendi kodumuzun 3.10 uyumlulugu bu sayede KAYBOLMAZ: ruff
# ``target-version = "py310"`` ile kaynagi zorluyor ve CI matrisi mypy'yi
# 3.10 yorumlayicisi altinda da ayrica kosuyor.
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true
